[app]
id = "org.wshell.hello-server"
version = "0.1.0"
name = "Hello server"
shell_api = "0.1"

[backend]
kind = "command"                     # ordinary program with main (wasi:cli/run)
world = "wasi:cli/command"

[[permissions]]
id = "net.listen"
ports = [8480]
reason = "The program's own HTTP server"
