<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ping</title>
  <link rel="stylesheet" href="style.css">
  <script src="/_shell/shell.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>Ping</h1>
    <span id="conn" class="badge">disconnected</span>
  </header>
  <form id="form">
    <input id="host" name="host" placeholder="example.com or 1.1.1.1" autocomplete="off" required list="history">
    <datalist id="history"></datalist>
    <label>packets <input id="count" type="number" min="1" max="20" value="4"></label>
    <button id="ping" type="submit">ping</button>
    <button id="trace" type="button">tracepath</button>
    <button id="cancel" type="button" disabled>stop</button>
  </form>
  <p id="error" class="error" hidden></p>
  <pre id="out"></pre>
</body>
</html>
