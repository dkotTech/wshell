<!DOCTYPE html><html>
<head><meta charset="utf-8"><title>render-rs viewer</title>
<style>
  * { margin: 0; }
  body { background: #0b0f14; min-height: 100vh; display: flex;
         flex-direction: column; align-items: center; justify-content: center;
         gap: 10px; font: 12px monospace; color: #64748b; }
  /* The frame is pixel art (an 8px-grid UI); it must only ever be scaled by an
     integer factor, otherwise nearest-neighbour drops/duplicates rows and the
     text looks clipped. JS sets an exact integer CSS size below. */
  canvas { image-rendering: pixelated; outline: 1px solid #263241; cursor: crosshair; }
  .bar a { color: #7dd3fc; text-decoration: none; }
</style></head>
<body>
  <canvas id="c" tabindex="0"></canvas>
  <div class="bar"><a href="/">← renders</a> <span id="status">connecting…</span></div>
<script>
const id = location.pathname.split('/').pop();
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');

const proto = location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${proto}://${location.host}/api/renders/${id}/ws`);
ws.binaryType = 'arraybuffer';

// Fit the canvas to the window at the largest *integer* scale, in device
// pixels — so one source pixel maps to an NxN block and nothing is dropped.
function fitCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const availW = window.innerWidth * 0.96 * dpr;
  const availH = window.innerHeight * 0.88 * dpr;
  const scale = Math.max(1, Math.floor(Math.min(availW / canvas.width, availH / canvas.height)));
  // CSS size = integer device blocks converted back to CSS px.
  canvas.style.width = (canvas.width * scale) / dpr + 'px';
  canvas.style.height = (canvas.height * scale) / dpr + 'px';
}
window.addEventListener('resize', fitCanvas);

let drawing = false;
ws.onmessage = async (e) => {
  if (typeof e.data === 'string') {
    const meta = JSON.parse(e.data);
    canvas.width = meta.w; canvas.height = meta.h;
    status.textContent = `#${id} ${meta.url} · ${meta.w}×${meta.h}`;
    fitCanvas();
    return;
  }
  if (drawing) return; // skip frame if previous is still decoding
  drawing = true;
  try {
    const bmp = await createImageBitmap(new Blob([e.data], { type: 'image/png' }));
    if (canvas.width !== bmp.width || canvas.height !== bmp.height) {
      canvas.width = bmp.width; canvas.height = bmp.height;
      fitCanvas();
    }
    ctx.drawImage(bmp, 0, 0);
    bmp.close();
  } finally { drawing = false; }
};
ws.onclose = () => { status.textContent = 'disconnected'; };

function send(ev) { if (ws.readyState === 1) ws.send(JSON.stringify(ev)); }

// map browser coords → render coords
function pos(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (canvas.width / r.width),
    y: (e.clientY - r.top) * (canvas.height / r.height),
  };
}

// mouse — move throttled to ~60/s
let lastMove = 0;
canvas.addEventListener('mousemove', (e) => {
  const now = performance.now();
  if (now - lastMove < 16) return;
  lastMove = now;
  send({ type: 'mouse_move', ...pos(e) });
});
const BTN = ['left', 'middle', 'right'];
canvas.addEventListener('mousedown', (e) => {
  canvas.focus();
  e.preventDefault();
  send({ type: 'mouse_button', button: BTN[e.button] || 'left', state: 'down', ...pos(e) });
});
canvas.addEventListener('mouseup', (e) => {
  e.preventDefault();
  send({ type: 'mouse_button', button: BTN[e.button] || 'left', state: 'up', ...pos(e) });
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  send({ type: 'wheel', ...pos(e), dx: e.deltaX, dy: e.deltaY });
}, { passive: false });

// keyboard — forwarded while the canvas has focus
canvas.addEventListener('keydown', (e) => {
  e.preventDefault();
  send({ type: 'key', key: e.key, state: 'down' });
});
canvas.addEventListener('keyup', (e) => {
  e.preventDefault();
  send({ type: 'key', key: e.key, state: 'up' });
});
canvas.focus();
</script>
</body></html>
