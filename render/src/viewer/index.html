<!DOCTYPE html><html>
<head><meta charset="utf-8"><title>render-rs</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #0b0f14; color: #e2e8f0; font: 14px/1.5 monospace;
         max-width: 720px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 18px; margin-bottom: 16px; }
  h1 small { color: #64748b; font-weight: normal; }
  .card { background: #131a22; border: 1px solid #263241; border-radius: 8px;
          padding: 12px 16px; margin-bottom: 10px; display: flex;
          align-items: center; gap: 14px; }
  .card .meta { flex: 1; min-width: 0; }
  .card .url { color: #7dd3fc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .dim { color: #64748b; font-size: 12px; }
  a.btn, button { background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit;
    font-size: 12px; text-decoration: none; }
  a.btn:hover, button:hover { background: #334155; }
  button.del { border-color: #7f1d1d; color: #fca5a5; }
  form { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  input { background: #0b0f14; color: #e2e8f0; border: 1px solid #334155;
          border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 12px; }
  input[name=url] { flex: 1; min-width: 220px; }
  input[name=width], input[name=height], input[name=fps] { width: 64px; }
  .empty { color: #64748b; padding: 24px 0; }
</style></head>
<body>
  <h1>render-rs <small id="engine"></small></h1>
  <div id="list"><div class="empty">loading…</div></div>
  <form id="add">
    <input name="url" placeholder="http://localhost:5173/" required>
    <input name="width" type="number" value="640" title="width">
    <input name="height" type="number" value="480" title="height">
    <input name="fps" type="number" value="30" title="fps">
    <button type="submit">+ render</button>
  </form>
<script>
async function load() {
  const list = await (await fetch('/api/renders')).json();
  document.getElementById('engine').textContent = list[0] ? '· ' + list[0].engine : '';
  const el = document.getElementById('list');
  el.innerHTML = '';
  if (!list.length) { el.innerHTML = '<div class="empty">no renders — add one below</div>'; return; }
  for (const r of list) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="meta">
        <div class="url">#${r.id} ${r.url}</div>
        <div class="dim">${r.width}×${r.height} @ ${r.fps}fps · ${r.clients} client(s)</div>
      </div>
      <a class="btn" href="${r.viewer}">open</a>
      <button class="del">✕</button>`;
    card.querySelector('.del').onclick = async () => {
      await fetch('/api/renders/' + r.id, { method: 'DELETE' });
      load();
    };
    el.appendChild(card);
  }
}
document.getElementById('add').onsubmit = async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  await fetch('/api/renders', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      url: f.get('url'),
      width: +f.get('width'), height: +f.get('height'), fps: +f.get('fps'),
    }),
  });
  e.target.reset();
  load();
};
load();
setInterval(load, 3000);
</script>
</body></html>
